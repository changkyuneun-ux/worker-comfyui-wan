name: build-and-push-baked

on:
  push:
    branches: [main]
    paths:
      - "bake/**"
      - "s3_handler.py"
      - "start.sh"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-baked

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 1) 루트 디스크 정리 (~30GB 확보)
      - name: Free disk space (root)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2) Docker 저장소를 /mnt(러너 보조 디스크, ~60GB 여유)로 이동
      - name: Move docker data-root to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep -i "docker root dir"
          df -h / /mnt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker 드라이버(데몬 저장소 사용) — GHA 레이어 캐시는 디스크를 추가로 먹으므로 사용 안 함
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # bake/Dockerfile: 모델 + 내부 전용 LoRA 4종 내장. RunPod 자체 GitHub 빌드(30분 제한, 캐시 없음)는
      # 이 파일을 계속 시도하지만 타임아웃되므로, 실제 배포 이미지는 이 워크플로가 만들어 RunPod
      # 엔드포인트 image 필드에 직접 고정한다(수동 update-endpoint).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bake/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Disk usage after build
        if: always()
        run: df -h / /mnt
