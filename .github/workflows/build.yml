name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
    # bake/ (RunPod 빌드용)와 문서 변경은 sage 이미지 재빌드(31분) 불필요.
    # start.sh 변경 시 sage 이미지에도 반영하려면 Actions에서 workflow_dispatch로 수동 실행.
    paths-ignore:
      - "bake/**"
      - "**.md"
      - "start.sh"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 1) 루트 디스크 정리 (~30GB 확보)
      - name: Free disk space (root)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2) Docker 저장소를 /mnt(러너 보조 디스크, ~60GB 여유)로 이동
      - name: Move docker data-root to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep -i "docker root dir"
          df -h / /mnt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker 드라이버(데몬 저장소 사용) — GHA 레이어 캐시는 디스크를 추가로 먹으므로 사용 안 함
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:5.10.0-sage
            ${{ env.IMAGE }}:latest

      - name: Disk usage after build
        if: always()
        run: df -h / /mnt
